port: 8080
env: production
db:
  dsn: "postgres://postgres:postgres@postgres:5432/app_db?sslmode=disable"
trustedOrigins:
  - http://localhost:3000
  - http://localhost
storage:
  endpoint: "http://minio:9000"
  publicEndpoint: "http://localhost:9000"
  region: "us-east-1"
  bucket: "images"
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  usePathStyle: true
  createBucket: true
  presignPutTTL: "5m"
  presignGetTTL: "15m"
