name: proj-img-upload-view

services:
  # nginx as reverse proxy
  reverse-proxy:
    image: nginx:stable
    container_name: reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - api-network
    depends_on:
      - api-service
      - frontend
    restart: unless-stopped

  # frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: frontend_app
    environment:
      - VITE_API_URL=http://localhost/api
    networks:
      - api-network
    restart: unless-stopped

  # API
  api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api_service
    environment:
      - PORT=8080
      - DB_DSN=postgres://postgres:postgres@postgres:5432/app_db?sslmode=disable
    volumes:
      - ./configs/config.yaml:/etc/secrets/config.yaml
    networks:
      - api-network
      - repository-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # MinIO AIStor (S3-compatible object storage)
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio_server
    command: server /mnt/data --console-address ":9001" --license /minio.license
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_API_CORS_ALLOW_ORIGIN=http://localhost
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/mnt/data
      - ${MINIO_LICENSE_PATH:-./minio.license}:/minio.license:ro
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres_target
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - repository-network
    healthcheck:
      test: pg_isready -U postgres -d app_db
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

networks:
  api-network:
    driver: bridge
  repository-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
